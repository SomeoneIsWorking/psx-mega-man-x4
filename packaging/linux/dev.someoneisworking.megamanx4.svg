<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Mega Man X4 port icon</title>
  <desc id="description">A blue arm cannon firing a charged yellow energy shot.</desc>
  <defs>
    <linearGradient id="backdrop" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17407a"/>
      <stop offset="1" stop-color="#06142e"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="106" fill="url(#backdrop)"/>
  <rect x="35" y="35" width="442" height="442" rx="91" fill="none" stroke="#7cd3ff" stroke-width="6" opacity=".75"/>

  <g filter="url(#shadow)" stroke-linejoin="round">
    <circle cx="350" cy="230" r="86" fill="#ffe14a" stroke="#06142e" stroke-width="12"/>
    <circle cx="350" cy="230" r="48" fill="#fffbe0"/>
    <g stroke="#ffe14a" stroke-width="12" stroke-linecap="round">
      <path d="M350 106v-28"/><path d="M440 160l22-18"/><path d="M462 260h28"/><path d="M432 330l18 22"/>
    </g>
    <path d="M96 300l120-70 40 68-120 70Z" fill="#2e7fe0" stroke="#06142e" stroke-width="12"/>
    <rect x="214" y="206" width="70" height="92" rx="20" transform="rotate(-30 249 252)" fill="#7cd3ff" stroke="#06142e" stroke-width="12"/>
  </g>
</svg>
